protocol_id: cfpb-neural-v1
freeze_date: '2026-10-03'
study_type: retrospective temporal replay
debt_future_pilot_inspected: true
credit_predictive_results_inspected: false
labels_minimum_training_n: 200
input_columns: [narrative]
question: Which official CFPB Issue best matches this complaint?
option_order: alphabetical_original_label
train: ['2023-09-01', '2024-06-30']
validation: ['2024-07-01', '2024-09-30']
temperature_fit: ['2024-10-01', '2024-10-31']
gate_selection: ['2024-11-01', '2024-11-30']
gate_verification: ['2024-12-01', '2024-12-31']
future_quarters: [2025Q1, 2025Q2, 2025Q3, 2025Q4, 2026Q1]
exploratory_quarters: [2026Q2]
excluded_months: ['2026-07', '2026-08']
train_deduplication: earliest_exact_text
calibration_gate_families: exclude_train_validation_and_earlier_calibration_roles_then_one_representative
operational_evaluation: all_included_narratives
novel_sensitivity: exclude_any_family_seen_before_current_quarter_then_earliest_representative
pilot_novel_sensitivity: also_report_original_train_validation_exclusion
max_total_tokens: 512
head_max_len: 256
truncation: keep_first_state_tokens_that_fit_typed_head_shared_across_models
seeds: [17, 43, 101]
training:
  epochs: 4
  encoder_learning_rate: 0.000025
  head_learning_rate: 0.0001
  effective_batch: 64
  micro_batch_per_gpu: 4
  gradient_accumulation: 8
  world_size: 2
  optimizer: AdamW
  weight_decay: 0.01
  betas: [0.9, 0.999]
  epsilon: 0.00000001
  warmup_fraction: 0.06
  scheduler: cosine
  gradient_clip: 1.0
  precision: fp16_autocast_with_grad_scaler
  gradient_checkpointing: true
  class_weights: null
  label_smoothing: 0.0
  selection: largest_validation_macro_f1_then_lowest_nll_then_earliest_epoch
  hyperparameter_search: none
  oom_policy: halve_micro_batch_and_double_accumulation_before_results_keep_effective_batch_64
  checkpoint_policy: resume_exact_optimizer_rng_scheduler_state_never_change_epochs_for_future_results
  tfidf: retain_existing_results_no_refit
